spring:
  application:
    name: classroom-iot-be
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/classroom_iot?allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:classroom_iot_app}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-before-deploying-2026}
    expiration: ${JWT_EXPIRATION_MS:86400000}
  bootstrap:
    username: ${BOOTSTRAP_USERNAME:admin}
    password: ${BOOTSTRAP_PASSWORD:22052005}
    full-name: ${BOOTSTRAP_FULL_NAME:Admin}
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:2205}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    client-id: ${MQTT_CLIENT_ID:classroom-iot-backend}
    #Cấu hình topic MQTT
    # Topic MQTT mà ESP gửi số liệu cảm biến để backend nhận.
    topic-sensors: ${MQTT_TOPIC_SENSORS:data_sensors}
    topic-device-control: ${MQTT_TOPIC_DEVICE_CONTROL:device_control}
    topic-device-response: ${MQTT_TOPIC_DEVICE_RESPONSE:device_response}
    topic-device-availability: ${MQTT_TOPIC_DEVICE_AVAILABILITY:device_availability}
    command-timeout-ms: ${MQTT_COMMAND_TIMEOUT_MS:10000}
  storage:
    avatar-directory: ${AVATAR_UPLOAD_DIR:uploads/avatars}
